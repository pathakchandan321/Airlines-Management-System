<template>
    <lightning-card title="Airlines Flight Booking" icon-name="standard:travel_and_places">
        <div class="slds-p-around_medium">

            <!-- Header -->
            <div class="slds-text-heading_medium slds-m-bottom_medium">
                <h2>Search and Book Flights</h2>
            </div>

            <!-- Search Form -->
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        name="source"
                        label="From (Departure City)"
                        value={source}
                        placeholder="Select departure city"
                        options={cityOptions}
                        onchange={handleSourceChange}
                        required>
                    </lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        name="destination"
                        label="To (Destination City)"
                        value={destination}
                        placeholder="Select destination city"
                        options={cityOptions}
                        onchange={handleDestinationChange}
                        required>
                    </lightning-combobox>
                </div>
            </div>

            <!-- Search Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Search Flights"
                    icon-name="utility:search"
                    onclick={handleSearch}
                    disabled={isSearching}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Clear"
                    onclick={handleClear}>
                </lightning-button>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isSearching}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Searching flights" size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={errorMessage}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                        <h2>{errorMessage}</h2>
                    </div>
                </div>
            </template>

            <!-- Search Results -->
            <template if:true={hasSearched}>
                <div class="slds-m-top_large">
                    <template if:true={hasResults}>
                        <div class="slds-text-heading_small slds-m-bottom_small">
                            Available Flights ({results.length})
                        </div>

                        <template for:each={results} for:item="flight">
                            <div key={flight.scheduleId} class="slds-box slds-m-bottom_small">
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                                        <div class="slds-text-heading_small">{flight.flightName}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            Schedule: {flight.scheduleName}
                                        </div>
                                        <div class="slds-m-top_x-small">
                                            <lightning-badge label={flight.source}></lightning-badge>
                                            <lightning-icon icon-name="utility:forward" size="xx-small" class="slds-m-horizontal_x-small"></lightning-icon>
                                            <lightning-badge label={flight.destination}></lightning-badge>
                                        </div>
                                        <div class="slds-m-top_small">
                                            <div class="slds-text-body_small">
                                                <strong>Departure:</strong> {flight.departureFormatted}
                                            </div>
                                            <div class="slds-text-body_small">
                                                <strong>Arrival:</strong> {flight.arrivalFormatted}
                                            </div>
                                            <div class="slds-text-body_small">
                                                <strong>Available Seats:</strong> {flight.availableSeats}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right">
                                        <lightning-button
                                            variant="brand"
                                            label="Book Now"
                                            data-schedule-id={flight.scheduleId}
                                            onclick={handleBookFlight}
                                            class="slds-m-top_small">
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:false={hasResults}>
                        <div class="slds-text-align_center slds-m-top_medium">
                            <lightning-icon icon-name="utility:info" size="large"></lightning-icon>
                            <div class="slds-text-heading_small slds-m-top_small">No flights found</div>
                            <div class="slds-text-body_regular slds-text-color_weak">
                                Try different cities or check back later
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Booking Form Section -->
            <template if:true={selectedScheduleId}>
                <div class="slds-m-top_large">
                    <lightning-card title="Book Your Flight" icon-name="standard:case">
                        <div class="slds-p-around_medium">
                            <div class="slds-text-body_regular">
                                Selected Flight Schedule ID: {selectedScheduleId}
                            </div>
                            <div class="slds-m-top_medium slds-text-color_weak">
                                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                Booking form will be available here
                            </div>
                        </div>
                    </lightning-card>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
